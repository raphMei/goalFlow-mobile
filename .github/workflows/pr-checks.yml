name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Expo config check
        run: npx expo config --type public

      - name: Verify no .env files are tracked
        run: |
          tracked_env_files=$(git ls-files | grep -E '^\.env($|\.(local|.*\.local)$)' || true)
          if [ -n "$tracked_env_files" ]; then
            echo "::error::Des fichiers .env sont versionnés dans Git :"
            echo "$tracked_env_files"
            exit 1
          fi
          echo "Aucun fichier .env versionné."
